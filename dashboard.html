<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Pro Dashboard</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #121212; color: #00ff00; margin: 20px; }
        h1 { text-align: center; }
        #data-container { white-space: pre-wrap; word-wrap: break-word; border: 1px solid #00ff00; padding: 15px; background-color: #1e1e1e; }
    </style>
</head>
<body>
    <h1>Live Data Feed</h1>
    <div id="data-container">Loading data...</div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/get_data');
                const data = await response.text();
                document.getElementById('data-container').textContent = data;
            } catch (error) {
                document.getElementById('data-container').textContent = 'Error fetching data.';
            }
        }

        // Fetch data immediately and then every 5 seconds
        fetchData();
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
